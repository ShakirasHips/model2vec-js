name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json promises Node 18+. The test runner's glob needs 21+, so 18 and 20 build and run the
        # install check only.
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Tests
        if: matrix.node >= 22
        run: node --test "test/*.test.mjs"
      - name: Install the packed package and use it
        run: sh scripts/smoke.sh
